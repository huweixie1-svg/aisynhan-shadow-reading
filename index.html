<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AISynHan · 丝路汉语 · 课程总览</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#FAF7F2;
    --ink:#2B2B2B;
    --accent:#9C5C38;
    --accent-dark:#7C4627;
    --muted:#6E645A;
    --line:#E5DED2;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.6;
    padding:32px 16px 64px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  header{text-align:center;margin-bottom:32px;}
  .brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;}
  .logo-mark{flex:0 0 auto;display:block;}
  .brand-text{text-align:left;}
  .brand-name{font-size:24px;font-weight:700;letter-spacing:.01em;line-height:1.1;}
  .brand-accent{color:var(--accent);}
  .brand-sub{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-top:2px;}
  h1{font-size:26px;font-weight:700;margin-top:8px;}
  .sub{color:var(--muted);font-size:14px;margin-top:4px;}

  .student-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px;
    margin-bottom:18px;
  }
  .student-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .student-name{font-size:20px;font-weight:700;}
  .student-name-en{font-size:14px;color:var(--muted);font-weight:500;}
  .student-meta{font-size:13px;color:var(--muted);margin-bottom:14px;}

  .lesson-list{display:flex;flex-direction:column;gap:10px;}
  .lesson-link{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .15s ease,background .15s ease;
  }
  .lesson-link:hover{border-color:var(--accent);background:#FDFAF5;}
  .lesson-title{font-weight:600;font-size:15px;}
  .lesson-focus{font-size:12px;color:var(--accent);margin-top:2px;}
  .lesson-arrow{color:var(--muted);font-size:18px;flex-shrink:0;margin-left:12px;}

  footer{margin-top:40px;text-align:center;color:var(--muted);font-size:12px;}

  @media (max-width:600px){
    h1{font-size:22px;}
    .student-card{padding:18px 16px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg class="logo-mark" width="44" height="44" viewBox="0 0 44 44" aria-label="AISynHan logo">
        <rect x="1" y="1" width="42" height="42" rx="10" fill="#2B2B2B"/>
        <line x1="7" y1="17" x2="14" y2="17" stroke="#FAF7F2" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="17" y1="24" x2="24" y2="17" stroke="#FAF7F2" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M27 18 L30.5 26 L34 18" stroke="#9C5C38" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="37" y1="16" x2="43" y2="26" stroke="#FAF7F2" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <div class="brand-name">AI<span class="brand-accent">Syn</span>Han</div>
        <div class="brand-sub">丝路汉语 · 个性化跟读</div>
      </div>
    </div>
    <h1>课程总览</h1>
    <div class="sub">每位学生的每一课都独立保存，点击进入跟读练习</div>
  </header>

  <!-- ===== 学生：苏蕾 Soureh ===== -->
  <div class="student-card">
    <div class="student-head">
      <span class="student-name">苏蕾</span>
      <span class="student-name-en">Soureh</span>
    </div>
    <div class="student-meta">伊朗 · 零基础 · 当前在加拿大</div>
    <div class="lesson-list">
      <a href="soureh-l1.html" class="lesson-link">
        <div>
          <div class="lesson-title">第一课 · 自我介绍</div>
          <div class="lesson-focus">重点音素：j · x · sh · ü</div>
        </div>
        <span class="lesson-arrow">→</span>
      </a>
    </div>
  </div>

  <footer>AISynHan · 教师端课程总览 · 每课独立保存，互不覆盖</footer>
</div>
</body>
</html>
